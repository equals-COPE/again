<html>
	<head>
		<title>MyGameCrib</title>
		<link rel="stylesheet" type = "text/css"
		href = "MyStyle_2.css">
	</head>
	<body>
		<a href="index.html">
		<img class = "logo" 
		src = "https://icones.pro/wp-content/uploads/2022/07/icone-jeux-et-jeux-video-jaune.png" alt = "websiteicon.png">
    </a>
			
		<img class = "userIcon" 
		border = 0
		src = "https://i.pinimg.com/originals/ea/e3/8f/eae38f025c73045f983dd155949f81b1.jpg" 
		alt = "profilepicture">
		
		<img class = "bell" 
		src = "https://cdn-icons-png.flaticon.com/512/5934/5934242.png"
		alt = "notifications">
			
			<p align = "center"> 🔍 <input type = "text" search = "search" size = 60></p>
			
			
			
		<table class = "menu"
		border = 3 
		cellpadding = 15 
		cellspacing = 2>
			<tr>
			<td class = "Games"><a href="Pagina 3 - Actualización de sitio Web con HTML y CSS.html">Games</td>
        </a>
				<td class = "MyCollection"><a href="Pagina 2 - Actualización de sitio Web con HTML y CSS.html">MyCollection</td>
        </a>
				<td class = "Community"><a href="Pagina 4 - Actualización de sitio Web con HTML y CSS.html">Community</td>
        </a>
				<td class = "Settings"><a href="Pagina 5 - Actualización de sitio Web con HTML y CSS.html">Settings</td>
        </a>
			</tr>
		</table>
		<br><br><br><br><br><br><br>
		<img class = "pfp" 
		border = 0
		src = "https://i.pinimg.com/originals/ea/e3/8f/eae38f025c73045f983dd155949f81b1.jpg"  
			alt = "profilepicture">
			
			<h1 class = "username">
			Username</h1>
			
			<p class = "bio"
			border = 0>
			Description</p>
			
			
			<table class = "Collection"
			border = 5 
			cellpadding = 10 
			cellspacing = 10>
			<tr>
				<caption>MyCollection</caption>
				<th>Played</th>
				<th>Completed</th>
				<th>Backlogged</th>
				<th>Dropped</th>
			</tr>
			<tr>
				<td>20</td>
				<td>11</td>
				<td>30</td>
				<td>4</td>
			</tr>
		
		<table class = "recent"
			border = 5 
			cellpadding = 10 
			cellspacing = 10>
			<tr>
				<caption>Recenty Played</caption>
				<td><img class = "gameSize"
				src = "https://cdn2.steamgriddb.com/grid/ae758fbcbd5bd841516c53b3c08ebc6f.png" 
				alt = "game#1"></td>
				
				<td><img class = "gameSize"
				src = "https://cdn2.steamgriddb.com/file/sgdb-cdn/grid/1b1a8e1c60962dc3f07dd77229f36d5f.png"  
				alt = "game#2"></td>
				
				<td><img class = "gameSize"
				src = "https://cdn2.steamgriddb.com/file/sgdb-cdn/grid/a3e5b8833d2664729e19f21263f675a5.jpg"  
				alt = "game#3"></td>
				
				<td>See More →</td>
			</tr>
		</table>
		
		<table class = "Favorite"
			border = 5 
			cellpadding = 10 
			cellspacing = 10>
			<tr>
				<caption>Favorite Games</caption>
				<td><img class = "gameSize"
				src = "https://cdn2.steamgriddb.com/file/sgdb-cdn/grid/48f80b634fc8d3d9ec00cb9f04956a6d.png" 
				alt = "game#1"></td>
				
				<td><img class = "gameSize"
				src = "https://cdn2.steamgriddb.com/file/sgdb-cdn/grid/0327d825efc9703e56afaa2e9e1cef9e.png"  
				alt = "game#2"></td>
				
				<td><img class = "gameSize"
				src = "https://cdn2.steamgriddb.com/file/sgdb-cdn/grid/8421d1bec81a32020f86b6213981b65b.png" 
				alt = "game#3"></td>
				
				<td>See More →</td>
		</table>
			
		<table class = "userInfo"
			border = 5 
			cellpadding = 10 
			cellspacing = 10>
			<tr>
				<td>Games</td>
				<td>Reviews</td>
				<td>Friends</td>
				<td>Lists</td>
			</tr>
		</table>
	</body>
</html>
